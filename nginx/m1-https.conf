server {
    listen 80;
    server_name m1.zzqixiangkeji.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name m1.zzqixiangkeji.cn;

    root __APP_DIR__/frontend/dist;
    index index.html;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/m1.zzqixiangkeji.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m1.zzqixiangkeji.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /card-covers/ {
        alias __APP_DIR__/backend/uploads/share-cards/;
        limit_except GET HEAD { deny all; }
        etag off;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /play {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/play;
        proxy_http_version 1.1;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }

    location ~* "^/assets/[^/]+\\.(?:css|js)$" {
        try_files $uri =404;
        max_ranges 0;
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/card/[A-Za-z0-9_-]{20,128}$" {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }

    location ~ "^/s/[A-Za-z0-9]{6,8}$" {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/([A-Za-z0-9]{6,8})$" {
        rewrite "^/([A-Za-z0-9]{6,8})$" /api/short/$1 break;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
